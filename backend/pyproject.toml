[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-forensics"
version = "0.1.0"
description = "Local-first evidence-backed forensic investigation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.160.0", "uvicorn[standard]>=0.40,<1", "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3", "SQLAlchemy==2.1.6", "alembic==1.20.1",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=25,<26", "reportlab>=4.4,<5"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["spectre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
