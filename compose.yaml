name: spectre
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spectre
      POSTGRES_DB: spectre
      POSTGRES_PASSWORD: ${SPECTRE_DB_PASSWORD:?Set a random URL-safe SPECTRE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U spectre -d spectre"]
      interval: 5s
      timeout: 3s
      retries: 12
  init:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: [python, -m, spectre.cli, init]
    environment: &api-environment
      SPECTRE_DATABASE_URL: postgresql+psycopg://spectre:${SPECTRE_DB_PASSWORD}@postgres:5432/spectre
      SPECTRE_STORAGE_DIR: /app/data/evidence
      SPECTRE_INITIAL_PASSWORD: ${SPECTRE_INITIAL_PASSWORD:?Set SPECTRE_INITIAL_PASSWORD to 12+ characters in .env}
      SPECTRE_ALLOWED_ORIGIN: http://127.0.0.1:3000
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [evidence-data:/app/data]
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *api-environment
    depends_on:
      init: {condition: service_completed_successfully}
    volumes: [evidence-data:/app/data]
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    networks: [internal, browser]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres-data:
  evidence-data:
networks:
  internal: {internal: true}
  browser:
